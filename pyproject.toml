[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rms"
version = "0.1.0"
description = "RMS (Research Manager): sessions, thread claims and project state for long multi-session research projects"
requires-python = ">=3.13"
dependencies = ["textual>=8.2"]

[project.scripts]
rms = "rms.cli:main"

[tool.setuptools.packages.find]
include = ["rms*"]
